# Render Blueprint - RetailPulse as a free STATIC SITE (no server, never sleeps).
# All analysis runs in R before deployment:
#   Rscript pipeline/run_pipeline.R      (per store)  -> outputs/
#   Rscript scripts/knit_reports.R                     -> R Markdown reports
#   Rscript scripts/export_static.R                    -> site/data/*.json + site/reports/
# The generated site/ folder is committed, so Render only has to publish it.
# The Shiny version (app/, Dockerfile) is still in the repository; see README.
services:
  - type: web
    name: retailpulse-site
    runtime: static
    buildCommand: echo "site/ is pre-built from the R pipeline"
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=604800, immutable
