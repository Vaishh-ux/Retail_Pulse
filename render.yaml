# Render Blueprint - one Docker web service, no database needed
# (all results are read-only artifacts produced at build time).
services:
  - type: web
    name: retailpulse
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free             # no card needed; sleeps after ~15 min idle (first visit then takes ~1 min). Paid: starter/standard
    healthCheckPath: /favicon.svg   # static file: answers even while R is busy
    autoDeploy: true
    envVars:
      - key: RP_REBUILD
        value: "false"     # true = re-run the analysis during the build
      - key: RP_DATA_MODE
        value: auto        # auto | real | synthetic
      - key: RP_STORE_ID
        value: auto        # or a specific store id from FreshRetailNet-50K
      - key: RP_STORE_CACHE
        value: "3"         # stores kept in memory (about 6 MB each)
      - key: RP_ANOMALY_Z
        value: "3"
